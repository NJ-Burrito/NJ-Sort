<?xml version="1.0" encoding="UTF-8"?>
<!-- NJ-Sort logo, simplified variant for 16/20/24/32 px (2x2 grid, bigger shapes, no blur, no fine detail).
     Same tile, colours and idea as logo.svg. Own vector art. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E43B0"/><stop offset="1" stop-color="#12132E"/></linearGradient>
    <linearGradient id="ice" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C4C8EE"/></linearGradient>
    <linearGradient id="amb" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#FFD679"/><stop offset="1" stop-color="#F59A0A"/></linearGradient>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#tile)"/>
  <rect x="180" y="192" width="300" height="300" rx="70" fill="#05061A" opacity="0.45"/><rect x="180" y="180" width="300" height="300" rx="70" fill="url(#ice)"/>
    <rect x="544" y="192" width="300" height="300" rx="70" fill="#05061A" opacity="0.45"/><rect x="544" y="180" width="300" height="300" rx="70" fill="url(#ice)"/>
    <rect x="180" y="556" width="300" height="300" rx="70" fill="#05061A" opacity="0.45"/><rect x="180" y="544" width="300" height="300" rx="70" fill="url(#ice)"/>
    <rect x="544" y="544" width="300" height="300" rx="70" fill="none" stroke="#FFC857" stroke-width="22" stroke-dasharray="1 0" opacity="0.0"/>
  <rect x="574" y="556" width="300" height="300" rx="70" fill="#05061A" opacity="0.45"/><rect x="574" y="544" width="300" height="300" rx="70" fill="url(#amb)"/>
  </svg>
