<!doctype html><html lang="{{LANG}}" dir="{{DIR}}"><head><meta charset="utf-8"><style>
@font-face{font-family:TS;font-weight:500;src:url("{{FONTS}}/thmanyahsans-Medium.woff2")}
@font-face{font-family:TS;font-weight:700;src:url("{{FONTS}}/thmanyahsans-Bold.woff2")}
@font-face{font-family:TS;font-weight:900;src:url("{{FONTS}}/thmanyahsans-Black.woff2")}
*{box-sizing:border-box;margin:0}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:#0d0f26;font-family:TS,sans-serif;color:#eef0ff}
.stage{position:absolute;left:0;top:{{TOP}}px;width:1280px;height:640px;transform:scale({{S}});transform-origin:0 0;overflow:hidden;
 background:radial-gradient(ellipse 640px 520px at {{GLOWX}}px 300px,rgba(76,84,200,.55),rgba(76,84,200,0) 70%),radial-gradient(ellipse 420px 300px at {{GLOWX2}}px 640px,rgba(255,176,46,.20),rgba(255,176,46,0) 70%),linear-gradient(135deg,#14163a,#0d0f26 65%)}
.copy{position:absolute;{{COPYSIDE}}:72px;top:0;height:640px;width:480px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:20px}
.brand img{width:96px;height:96px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.5))}
h1{font-weight:900;font-size:84px;letter-spacing:-2px;line-height:1.05;white-space:nowrap}
h1 b{color:#FFB02E;font-weight:900}
.line{margin-top:30px;font-weight:700;font-size:38px;line-height:1.24;max-width:470px}
.line em{font-style:normal;color:#FFB02E}
.chips{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.chips span{font-weight:700;font-size:24px;color:#FFB02E;border:2px solid rgba(255,176,46,.5);border-radius:999px;padding:6px 20px 8px;background:rgba(255,176,46,.09)}
.c{position:absolute;overflow:hidden;border-radius:22px;border:2px solid rgba(180,190,255,.3);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.c img{display:block;width:100%;height:100%}
#d{left:{{DX}}px;top:56px;width:560px;height:461px;transform:rotate({{R1}}deg);filter:brightness(.82)}
#w{left:{{WX}}px;top:215px;width:380px;height:369px;transform:rotate({{R2}}deg);border-color:rgba(255,176,46,.5);box-shadow:0 40px 80px rgba(0,0,0,.72),0 0 80px rgba(255,176,46,.20)}
#t{position:absolute;left:{{TX}}px;top:462px;width:430px;transform:rotate({{R3}}deg);filter:drop-shadow(0 16px 24px rgba(0,0,0,.45))}
</style></head><body><div class="stage">
<div class="copy">
 <div class="brand"><img src="{{LOGO}}"><h1>NJ-<b>Sort</b></h1></div>
 <div class="line">{{LINE}}</div>
 <div class="chips">{{CHIPS}}</div>
</div>
<div class="c" id="d"><img style="object-fit:cover;object-position:0 0" src="{{DESK}}"></div>
<img id="t" src="{{TOAST}}">
<div class="c" id="w"><img src="{{WIN}}"></div>
</div></body></html>
