<!doctype html><html lang="{{LANG}}" dir="{{DIR}}"><head><meta charset="utf-8"><style>
@font-face{font-family:TS;font-weight:500;src:url("{{FONTS}}/thmanyahsans-Medium.woff2")}
@font-face{font-family:TS;font-weight:700;src:url("{{FONTS}}/thmanyahsans-Bold.woff2")}
@font-face{font-family:TS;font-weight:900;src:url("{{FONTS}}/thmanyahsans-Black.woff2")}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:1080px;overflow:hidden;font-family:TS,sans-serif;color:#eef0ff}
body{background:transparent}
:root{--amber:#FFB02E;--ink:#0d0f26;--indigo:#181a3a;--muted:#a9aed6}
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 900px 600px at 50% 30%,rgba(76,84,200,.34),rgba(76,84,200,0) 70%),
 radial-gradient(ellipse 700px 420px at 85% 100%,rgba(255,176,46,.13),rgba(255,176,46,0) 70%),
 linear-gradient(180deg,#14163a,#0d0f26 70%)}
/* title card */
.m-title .bg{background:radial-gradient(circle at 50% 40%,rgba(255,176,46,.16),rgba(255,176,46,0) 34%),radial-gradient(ellipse 900px 700px at 50% 38%,rgba(76,84,200,.42),rgba(76,84,200,0) 70%),linear-gradient(180deg,#14163a,#0d0f26 75%)}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.m-title .logo{width:340px;height:340px;filter:drop-shadow(0 26px 50px rgba(0,0,0,.5)) drop-shadow(0 0 60px rgba(255,176,46,.22));margin-top:-70px}
.m-title h1{font-weight:900;font-size:190px;letter-spacing:-5px;line-height:1.05;margin-top:26px}
.m-title h1 b{color:var(--amber);font-weight:900}
.m-title p{font-weight:500;font-size:46px;color:var(--muted);margin-top:14px;text-align:center;max-width:1200px;line-height:1.3}
.m-title .chip{margin-top:34px;font-weight:700;font-size:30px;letter-spacing:.5px;color:var(--amber);border:2px solid rgba(255,176,46,.55);border-radius:999px;padding:8px 28px;background:rgba(255,176,46,.09)}
/* scene stage (static parts) */
.head{position:absolute;left:60px;right:60px;top:30px;height:96px;display:flex;align-items:center;gap:20px}
.head img{width:78px;height:78px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
.head b{font-weight:900;font-size:54px;letter-spacing:-1px}
.head b i{font-style:normal;color:var(--amber)}
.foot{position:absolute;left:60px;right:60px;top:935px;height:110px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:46px;color:#eef0ff;text-align:center;line-height:1.25}
.foot em{font-style:normal;color:var(--amber)}
.shadow{position:absolute;left:60px;top:150px;width:1320px;height:739px;border-radius:28px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 120px rgba(76,84,200,.22);background:#000}
.ring{position:absolute;left:60px;top:150px;width:1320px;height:739px;border-radius:28px;border:2px solid rgba(180,190,255,.28)}
.bar{position:absolute;left:60px;top:150px;width:1320px;height:739px;border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
/* state chip (header, far side) */
.chipbox{position:absolute;left:60px;right:60px;top:30px;height:96px;display:flex;align-items:center;justify-content:flex-end}
.st{font-weight:700;font-size:36px;padding:12px 32px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:2px solid rgba(180,190,255,.30);color:#dfe2ff;display:flex;align-items:center;gap:16px;white-space:nowrap}
.st.hot{background:rgba(255,176,46,.14);border-color:rgba(255,176,46,.75);color:var(--amber)}
.st.ok{background:rgba(52,211,120,.13);border-color:rgba(52,211,120,.7);color:#6ee7a0}
.st kbd{font-family:TS;font-weight:700;font-size:32px;background:#262a5a;border:2px solid rgba(255,255,255,.22);border-bottom-width:5px;border-radius:12px;padding:0 16px;color:#fff;line-height:1.4}
.st kbd.on{background:var(--amber);border-color:#ffd37a;color:#241800}
.st .dot{width:16px;height:16px;border-radius:50%;background:currentColor}
/* window card */
.winc{position:absolute;left:30px;top:30px;width:{{WW}}px;height:{{WH}}px;border-radius:30px;overflow:hidden;border:2px solid rgba(180,190,255,.35);box-shadow:0 36px 80px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.4)}
.winc img{display:block;width:100%;height:100%}
</style></head><body class="m-{{MODE}}">
{{BODY}}
</body></html>
